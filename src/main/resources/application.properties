spring.application.name=activacorp-api
server.port=8082

# Para que los errores (400, 403, 409...) incluyan el mensaje en el JSON
server.error.include-message=always

# XAMPP: MySQL en el puerto 3306, usuario root y sin contraseña.
# createDatabaseIfNotExist=true crea la base bd_activacorp sola la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/bd_activacorp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
